name: Deploy Web

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 1. Enable corepack FIRST (CRÍTICO)
      - name: Enable Corepack
        run: corepack enable

      # 2. Setup Node (sin cache pnpm todavía)
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # 3. Activate pnpm explicitly
      - name: Prepare pnpm
        run: corepack prepare pnpm@10.33.4 --activate

      # 4. Now pnpm exists → safe cache path
      - name: Get pnpm store path
        run: echo "PNPM_STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.PNPM_STORE_PATH }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Setup Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set base path for GitHub Pages
        run: echo "BASE_PATH=/<REPO_NAME>" >> $GITHUB_ENV

      - name: Build web app
        run: pnpm turbo run build --filter=web...

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/build

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
