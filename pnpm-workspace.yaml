packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  esbuild: true

catalogs:
  sveltejs:
    "@sveltejs/adapter-auto": "7.0.1"
    "@sveltejs/kit": "2.70.2"
    "@sveltejs/vite-plugin-svelte": "7.3.0"
    "eslint-plugin-svelte": "3.23.0"
    "prettier-plugin-svelte": "4.1.1"
    "svelte": "5.56.9"

minimumReleaseAgeExclude:
  - '@turbo/darwin-64@2.11.5'
  - '@turbo/darwin-arm64@2.11.5'
  - '@turbo/linux-64@2.11.5'
  - '@turbo/linux-arm64@2.11.5'
  - '@turbo/windows-64@2.11.5'
  - '@turbo/windows-arm64@2.11.5'
  - turbo@2.11.5
